name: Build and release pb-mapper CLI

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Release ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux x86_64 musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - name: Linux ARMv7 musl
            os: ubuntu-latest
            target: armv7-unknown-linux-musleabi
          - name: Linux s390x GNU
            os: ubuntu-latest
            target: s390x-unknown-linux-gnu
          - name: macOS x86_64
            os: macos-latest
            target: x86_64-apple-darwin
          - name: macOS ARM64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: Windows x86_64 MSVC
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Verify release tag matches Cargo version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(awk '
            /^\[workspace.package\]$/ { in_workspace = 1; next }
            in_workspace && /^version = / {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' Cargo.toml)"
          test "${GITHUB_REF_NAME}" = "v${package_version}"

      - name: Build unified CLI
        uses: houseabsolute/actions-rust-cross@v1
        with:
          target: ${{ matrix.platform.target }}
          toolchain: 1.88.0
          args: "--locked --release --bin pb-mapper"
          strip: true

      - name: Package artifact and publish tagged release
        uses: houseabsolute/actions-rust-release@v0
        with:
          executable-name: pb-mapper
          target: ${{ matrix.platform.target }}
          archive-name: pb-mapper-${{ matrix.platform.target }}
          changes-file: CHANGELOG.md
          extra-files: |
            CHANGELOG.md
            LICENSE
            README.md
            README.zh-CN.md
            docs/authentication-v2.md
            docs/authentication-v2.zh-CN.md
            docs/user-guide.md
            docs/user-guide.zh-CN.md
