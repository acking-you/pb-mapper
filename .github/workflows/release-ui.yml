name: Release pb-mapper UI

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

env:
  UI_VERSION: ${{ github.ref_name }}

permissions:
  contents: write

jobs:
  get-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true          
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0            
      - name: Generate UI release notes from changelog
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="${VERSION}" '
            $0 ~ "^## \\[" ver "\\]" {capture=1}
            capture {
              if ($0 ~ "^## \\[" && $0 !~ "^## \\[" ver "\\]") exit
              print
            }
          ' CHANGELOG.md > changelog_section.md

          {
            echo "# pb-mapper UI Release ${GITHUB_REF_NAME}"
            echo
            echo "Cross-platform graphical interface for pb-mapper network tunneling tool."
            echo
            echo "## Downloads"
            echo "- **Windows**: Download the .exe installer or .zip portable version"
            echo "- **Linux**: x86_64 AppImage or portable ZIP"
            echo "- **macOS**: DMG installer"
            echo "- **Android**: Locally signed APKs are attached separately after upgrade verification."
            echo "- **iOS**: Install through a signed development or store distribution; no unsigned IPA is published."
            echo
            echo "## Latest Changelog"
            echo
            if [ -s changelog_section.md ]; then
              cat changelog_section.md
            else
              echo "_No changelog section found for version ${VERSION} in CHANGELOG.md._"
            fi
          } > ui_release_notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: ui-release-notes
          path: ui_release_notes.md

  build-windows:
    runs-on: windows-latest
    needs: [get-release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true          
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0            
      - uses: actions/download-artifact@v4
        with:
          name: ui-release-notes
      - name: Install make
        run: choco install make
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: "stable"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - name: Build latest Windows FFI
        run: |
          make build-pb-mapper-ffi-windows
      - name: Build Windows app with latest FFI
        run: |
          make release-ui-windows-no-ffi
      # fastforge names its output after the Dart package and the pubspec
      # version (pb_mapper_ui-0.9.0+900-windows-setup.exe); the in-app updater
      # and every other platform use pb-mapper-<os>-<arch>.
      - name: Name the Windows packages like the others
        run: |
          $setup = @(Get-ChildItem ui/dist -Recurse -Filter "*-windows-setup.exe")
          $zip = @(Get-ChildItem ui/dist -Recurse -Filter "*-windows.zip")
          if ($setup.Count -ne 1 -or $zip.Count -ne 1) {
            throw "Expected one installer and one zip, found: $($setup.Name) $($zip.Name)"
          }
          Rename-Item $setup[0].FullName "pb-mapper-windows-x86_64-setup.exe"
          Rename-Item $zip[0].FullName "pb-mapper-windows-x86_64.zip"
      - name: Verify Windows bundle uses latest FFI
        run: |
          $src = "ui/native/windows/x64/pb_mapper_ffi.dll"
          $dst = "ui/build/windows/x64/runner/Release/pb_mapper_ffi.dll"
          if (!(Test-Path $src)) { throw "FFI source dll not found: $src" }
          if (!(Test-Path $dst)) { throw "FFI dll not found in built UI bundle: $dst" }
          $srcHash = (Get-FileHash -Algorithm SHA256 $src).Hash
          $dstHash = (Get-FileHash -Algorithm SHA256 $dst).Hash
          if ($srcHash -ne $dstHash) {
            throw "FFI hash mismatch. source=$srcHash bundle=$dstHash"
          }
      - name: Upload Windows artifacts
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}-ui
          target_commitish: ${{ github.sha }}
          name: "pb-mapper UI ${{ github.ref_name }}"
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          body_path: ui_release_notes.md
          files: ui/dist/*/*

  build-linux:
    runs-on: ubuntu-22.04
    needs: [get-release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true          
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0            
      - uses: actions/download-artifact@v4
        with:
          name: ui-release-notes
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: "stable"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y locate ninja-build libgtk-3-dev libayatana-appindicator3-dev libnotify-dev \
          binutils coreutils desktop-file-utils fakeroot fuse libgdk-pixbuf2.0-dev patchelf python3-pip python3-setuptools squashfs-tools strace util-linux zsync
      - name: Build latest Linux FFI
        run: |
          make build-pb-mapper-ffi-linux
      - name: Build Linux app with latest FFI
        run: |
          make build-ui-linux-release-no-ffi
      - name: Verify Linux bundle uses latest FFI
        run: |
          SRC_FFI="ui/native/linux/x64/libpb_mapper_ffi.so"
          DST_FFI="ui/build/linux/x64/release/bundle/lib/libpb_mapper_ffi.so"
          test -f "${SRC_FFI}"
          test -f "${DST_FFI}"
          SRC_HASH="$(sha256sum "${SRC_FFI}" | awk '{print $1}')"
          DST_HASH="$(sha256sum "${DST_FFI}" | awk '{print $1}')"
          if [ "${SRC_HASH}" != "${DST_HASH}" ]; then
            echo "FFI hash mismatch: src=${SRC_HASH} dst=${DST_HASH}"
            exit 1
          fi
      - name: Package Linux artifacts
        run: |
          cd ui

          # Create directory structure for packaging
          mkdir -p dist/${UI_VERSION}

          # Create ZIP package
          cd build/linux/x64/release/bundle
          zip -r ../../../../../dist/${UI_VERSION}/pb-mapper-linux.zip .

          # Create AppImage (basic)
          cd ../../../../../
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          # Copy binary and dependencies
          cp -r build/linux/x64/release/bundle/* AppDir/usr/bin/

          # Copy icon
          cp assets/app_icon.png AppDir/usr/share/icons/hicolor/256x256/apps/pb-mapper.png
          cp AppDir/usr/share/icons/hicolor/256x256/apps/pb-mapper.png AppDir/pb-mapper.png

          # Create desktop file
          cat > AppDir/usr/share/applications/pb-mapper.desktop << EOF
          [Desktop Entry]
          Name=pb-mapper
          Comment=Network port mapping and tunneling tool
          Exec=ui
          Icon=pb-mapper
          Terminal=false
          Type=Application
          Categories=Network;
          EOF

          # Copy desktop file to root
          cp AppDir/usr/share/applications/pb-mapper.desktop AppDir/

          # Create AppRun
          cat > AppDir/AppRun << 'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          export LD_LIBRARY_PATH="${HERE}/usr/bin/lib:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/bin/ui" "$@"
          EOF
          chmod +x AppDir/AppRun

          # Build AppImage
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage AppDir dist/${UI_VERSION}/pb-mapper-linux.AppImage
      - name: Upload Linux artifacts
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}-ui
          target_commitish: ${{ github.sha }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          body_path: ui_release_notes.md
          files: ui/dist/${{ env.UI_VERSION }}/*

  # Mobile packages are built locally with a persistent signing identity.
  # See docs/ui-updates.md; never publish a runner-generated debug key.
  build-macos:
    # One native runner per architecture: each .app carries a single-arch FFI
    # dylib, so the artifacts are roughly half the size of a universal build.
    runs-on: ${{ matrix.runner }}
    needs: [get-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true          
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0            
      - uses: actions/download-artifact@v4
        with:
          name: ui-release-notes
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: "stable"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - name: Install appdmg
        run: |
          npm install -g appdmg
      - name: Build latest macOS FFI
        run: |
          make build-pb-mapper-ffi-macos
      - name: Build macOS app with latest FFI
        run: |
          make build-ui-macos-release-no-ffi
      - name: Verify macOS build matches runner arch
        run: |
          APP="$(find ui/build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -n1)"
          for bin in "${APP}/Contents/MacOS/pb-mapper" \
                     "${APP}/Contents/Frameworks/libpb_mapper_ffi.dylib"; do
            got="$(lipo -archs "${bin}")"
            echo "${bin}: ${got}"
            [ "${got}" = "${{ matrix.arch }}" ] \
              || { echo "expected ${{ matrix.arch }}, got ${got}"; exit 1; }
          done
      - name: Verify macOS app bundle uses latest FFI
        run: |
          SRC_FFI="ui/native/macos/libpb_mapper_ffi.dylib"
          DST_FFI="$(find ui/build/macos/Build/Products/Release -type f -name libpb_mapper_ffi.dylib | head -n1)"
          test -f "${SRC_FFI}"
          test -n "${DST_FFI}"
          test -f "${DST_FFI}"
          SRC_HASH="$(shasum -a 256 "${SRC_FFI}" | awk '{print $1}')"
          DST_HASH="$(shasum -a 256 "${DST_FFI}" | awk '{print $1}')"
          if [ "${SRC_HASH}" != "${DST_HASH}" ]; then
            echo "FFI hash mismatch: src=${SRC_HASH} dst=${DST_HASH}"
            exit 1
          fi
      - name: Package macOS artifacts
        run: |
          cd ui
          PROJECT_DIR=$(pwd)
          cd build/macos/Build/Products/Release
          cat>appdmg.json<<EOF
          {
            "title": "pb-mapper",
            "icon": "pb-mapper.app/Contents/Resources/AppIcon.icns",
            "contents": [
              { "x": 448, "y": 344, "type": "link", "path": "/Applications" },
              { "x": 192, "y": 344, "type": "file", "path": "pb-mapper.app" }
            ]
          }
          EOF
          mkdir dist
          DMG="pb-mapper-macos-${{ matrix.arch }}.dmg"
          echo "DMG_ASSET=ui/build/macos/Build/Products/Release/dist/${DMG}" >> $GITHUB_ENV
          appdmg appdmg.json "dist/${DMG}"
      - name: Upload macOS artifacts
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}-ui
          target_commitish: ${{ github.sha }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          body_path: ui_release_notes.md
          files: |
            ${{env.DMG_ASSET}}

  # The app updates itself only from a release whose manifest this key signs,
  # and installs only files whose size and SHA-256 the manifest lists. A
  # manual run has no version tag to check the manifest against, so only a
  # tag push publishes one.
  publish-manifest:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-macos]
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE: ${{ github.ref_name }}-ui
    steps:
      - uses: actions/checkout@v4
      - name: Collect the release's packages
        run: gh release download "$RELEASE" --repo "$GITHUB_REPOSITORY" --dir release --pattern 'pb-mapper-*'
      - name: Write the release manifest
        run: python3 scripts/release/ui_release_manifest.py build release "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - name: Sign the release manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          test -n "$UPDATE_SIGNING_KEY" || { echo "::error::UPDATE_SIGNING_KEY is not set"; exit 1; }
          KEY=$(mktemp)
          trap 'rm -f "$KEY"' EXIT
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$KEY"
          python3 scripts/release/ui_release_manifest.py sign release/release-manifest.json --key "$KEY"
          python3 scripts/release/ui_release_manifest.py verify release/release-manifest.json --public-key scripts/release/update_signing_key.pub.pem
      - name: Attach the manifest
        run: gh release upload "$RELEASE" release/release-manifest.json release/release-manifest.json.sig --repo "$GITHUB_REPOSITORY" --clobber
