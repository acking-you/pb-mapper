name: Release pb-mapper UI

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      macos_verify_only:
        description: 'Build, sign and notarize both macOS architectures without publishing a release'
        type: boolean
        default: false
      android_verify_only:
        description: 'Build and verify signed Android APKs without publishing a release'
        type: boolean
        default: false

env:
  UI_VERSION: ${{ github.ref_name }}

permissions:
  contents: write

concurrency:
  group: android-manifest-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  get-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true          
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0            
      - name: Generate UI release notes from changelog
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="${VERSION}" '
            $0 ~ "^## \\[" ver "\\]" {capture=1}
            capture {
              if ($0 ~ "^## \\[" && $0 !~ "^## \\[" ver "\\]") exit
              print
            }
          ' CHANGELOG.md > changelog_section.md

          {
            echo "# pb-mapper UI Release ${GITHUB_REF_NAME}"
            echo
            echo "Cross-platform graphical interface for pb-mapper network tunneling tool."
            echo
            echo "## Downloads"
            echo "- **Windows**: Download the .exe installer or .zip portable version"
            echo "- **Linux**: x86_64 AppImage or portable ZIP"
            echo "- **macOS**: DMG installer"
            echo "- **Android**: Signed APKs for ARM64, ARMv7 and x86_64."
            echo "- **iOS**: Install through a signed development or store distribution; no unsigned IPA is published."
            echo
            echo "## Latest Changelog"
            echo
            if [ -s changelog_section.md ]; then
              cat changelog_section.md
            else
              echo "_No changelog section found for version ${VERSION} in CHANGELOG.md._"
            fi
          } > ui_release_notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: ui-release-notes
          path: ui_release_notes.md

  build-windows:
    if: ${{ !inputs.macos_verify_only && !inputs.android_verify_only }}
    runs-on: windows-latest
    needs: [get-release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true          
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0            
      - uses: actions/download-artifact@v4
        with:
          name: ui-release-notes
      - name: Install make
        run: choco install make
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: "stable"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - name: Build latest Windows FFI
        run: |
          make build-pb-mapper-ffi-windows
      - name: Build Windows app with latest FFI
        run: |
          make release-ui-windows-no-ffi
      # fastforge names its output after the Dart package and the pubspec
      # version (pb_mapper_ui-0.9.0+900-windows-setup.exe); the in-app updater
      # and every other platform use pb-mapper-<os>-<arch>.
      - name: Name the Windows packages like the others
        run: |
          $setup = @(Get-ChildItem ui/dist -Recurse -Filter "*-windows-setup.exe")
          $zip = @(Get-ChildItem ui/dist -Recurse -Filter "*-windows.zip")
          if ($setup.Count -ne 1 -or $zip.Count -ne 1) {
            throw "Expected one installer and one zip, found: $($setup.Name) $($zip.Name)"
          }
          Rename-Item $setup[0].FullName "pb-mapper-windows-x86_64-setup.exe"
          Rename-Item $zip[0].FullName "pb-mapper-windows-x86_64.zip"
      - name: Verify Windows bundle uses latest native components
        run: |
          foreach ($name in @("pb_mapper_ffi.dll", "pb-mapper-desktop-helper.exe")) {
            $src = "ui/native/windows/x64/$name"
            $dst = "ui/build/windows/x64/runner/Release/$name"
            if (!(Test-Path $src)) { throw "Native component source missing: $src" }
            if (!(Test-Path $dst)) { throw "Native component missing in UI bundle: $dst" }
            if ((Get-FileHash -Algorithm SHA256 $src).Hash -ne (Get-FileHash -Algorithm SHA256 $dst).Hash) {
              throw "Native component hash mismatch: $name"
            }
          }
      - name: Upload Windows artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}-ui
          target_commitish: ${{ github.sha }}
          name: "pb-mapper UI ${{ github.ref_name }}"
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          body_path: ui_release_notes.md
          files: ui/dist/*/*

  build-linux:
    if: ${{ !inputs.macos_verify_only && !inputs.android_verify_only }}
    runs-on: ubuntu-22.04
    needs: [get-release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true          
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0            
      - uses: actions/download-artifact@v4
        with:
          name: ui-release-notes
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: "stable"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y locate ninja-build libgtk-3-dev libayatana-appindicator3-dev libnotify-dev \
          binutils coreutils desktop-file-utils fakeroot fuse libgdk-pixbuf2.0-dev patchelf python3-pip python3-setuptools squashfs-tools strace util-linux zsync
      - name: Build latest Linux FFI
        run: |
          make build-pb-mapper-ffi-linux
      - name: Build Linux app with latest FFI
        run: |
          make build-ui-linux-release-no-ffi
      - name: Verify Linux bundle uses latest FFI
        run: |
          SRC_FFI="ui/native/linux/x64/libpb_mapper_ffi.so"
          DST_FFI="ui/build/linux/x64/release/bundle/lib/libpb_mapper_ffi.so"
          test -f "${SRC_FFI}"
          test -f "${DST_FFI}"
          SRC_HASH="$(sha256sum "${SRC_FFI}" | awk '{print $1}')"
          DST_HASH="$(sha256sum "${DST_FFI}" | awk '{print $1}')"
          if [ "${SRC_HASH}" != "${DST_HASH}" ]; then
            echo "FFI hash mismatch: src=${SRC_HASH} dst=${DST_HASH}"
            exit 1
          fi
      - name: Package Linux artifacts
        run: |
          cd ui

          # Create directory structure for packaging
          mkdir -p "dist/${UI_VERSION}"

          # Create ZIP package
          cd build/linux/x64/release/bundle
          zip -r "../../../../../dist/${UI_VERSION}/pb-mapper-linux.zip" .

          # Create AppImage (basic)
          cd ../../../../../
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          # Copy binary and dependencies
          cp -r build/linux/x64/release/bundle/* AppDir/usr/bin/

          # Copy icon
          cp assets/app_icon.png AppDir/usr/share/icons/hicolor/256x256/apps/pb-mapper.png
          cp AppDir/usr/share/icons/hicolor/256x256/apps/pb-mapper.png AppDir/pb-mapper.png

          # Create desktop file
          cat > AppDir/usr/share/applications/pb-mapper.desktop << EOF
          [Desktop Entry]
          Name=pb-mapper
          Comment=Network port mapping and tunneling tool
          Exec=ui
          Icon=pb-mapper
          Terminal=false
          Type=Application
          Categories=Network;
          EOF

          # Copy desktop file to root
          cp AppDir/usr/share/applications/pb-mapper.desktop AppDir/

          # Create AppRun
          cat > AppDir/AppRun << 'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          export LD_LIBRARY_PATH="${HERE}/usr/bin/lib:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/bin/ui" "$@"
          EOF
          chmod +x AppDir/AppRun

          # Build AppImage
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage AppDir "dist/${UI_VERSION}/pb-mapper-linux.AppImage"
      - name: Upload Linux artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}-ui
          target_commitish: ${{ github.sha }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          body_path: ui_release_notes.md
          files: ui/dist/${{ env.UI_VERSION }}/*

  build-macos:
    if: ${{ !inputs.android_verify_only }}
    # One native runner per architecture: each .app carries a single-arch FFI
    # dylib, so the artifacts are roughly half the size of a universal build.
    runs-on: ${{ matrix.runner }}
    needs: [get-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true          
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0            
      - uses: actions/download-artifact@v4
        with:
          name: ui-release-notes
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: "stable"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - name: Check signing configuration
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_PRIVATE_KEY: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
        run: |
          python3 - <<'PY'
          import os
          required = ('MACOS_CERTIFICATE_P12_BASE64', 'MACOS_CERTIFICATE_PASSWORD',
                      'APPLE_NOTARY_PRIVATE_KEY', 'MACOS_SIGNING_IDENTITY', 'APPLE_TEAM_ID',
                      'APPLE_NOTARY_KEY_ID', 'APPLE_NOTARY_ISSUER_ID')
          missing = [key for key in required if not os.environ.get(key)]
          if missing:
              raise SystemExit('Missing signing configuration: ' + ', '.join(missing))
          PY
      - name: Build latest macOS FFI
        run: |
          make build-pb-mapper-ffi-macos
      - name: Build macOS app with latest FFI
        run: |
          make build-ui-macos-release-no-ffi
      - name: Verify macOS build matches runner arch
        run: |
          APP="$(find ui/build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -n1)"
          for bin in "${APP}/Contents/MacOS/pb-mapper" \
                     "${APP}/Contents/Frameworks/libpb_mapper_ffi.dylib"; do
            got="$(lipo -archs "${bin}")"
            echo "${bin}: ${got}"
            [ "${got}" = "${{ matrix.arch }}" ] \
              || { echo "expected ${{ matrix.arch }}, got ${got}"; exit 1; }
          done
      - name: Verify macOS app bundle uses latest FFI
        run: |
          SRC_FFI="ui/native/macos/libpb_mapper_ffi.dylib"
          DST_FFI="$(find ui/build/macos/Build/Products/Release -type f -name libpb_mapper_ffi.dylib | head -n1)"
          test -f "${SRC_FFI}"
          test -n "${DST_FFI}"
          test -f "${DST_FFI}"
          SRC_HASH="$(shasum -a 256 "${SRC_FFI}" | awk '{print $1}')"
          DST_HASH="$(shasum -a 256 "${DST_FFI}" | awk '{print $1}')"
          if [ "${SRC_HASH}" != "${DST_HASH}" ]; then
            echo "FFI hash mismatch: src=${SRC_HASH} dst=${DST_HASH}"
            exit 1
          fi
      - name: Sign, notarize and verify macOS package
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_PRIVATE_KEY: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
        run: |
          python3 scripts/release/macos_package.py \
            --app ui/build/macos/Build/Products/Release/pb-mapper.app \
            --arch '${{ matrix.arch }}' \
            --output 'ui/dist/pb-mapper-macos-${{ matrix.arch }}.dmg'
      - name: Clean up temporary signing credentials
        if: always()
        run: |
          python3 - <<'PY'
          import os, pathlib, shutil, subprocess
          for directory in pathlib.Path(os.environ['RUNNER_TEMP']).glob('pb-mapper-signing-*'):
              keychain = directory / 'signing.keychain-db'
              if keychain.exists():
                  subprocess.run(['security', 'delete-keychain', str(keychain)], check=True)
              shutil.rmtree(directory)
          PY
      - name: Upload signing verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-verification
          path: ui/dist/*-verification/
          if-no-files-found: ignore
      - name: Upload verified macOS package
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-dmg
          path: ui/dist/pb-mapper-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error
      - name: Upload macOS artifacts
        if: ${{ !inputs.macos_verify_only }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}-ui
          target_commitish: ${{ github.sha }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          body_path: ui_release_notes.md
          files: |
            ui/dist/pb-mapper-macos-${{ matrix.arch }}.dmg

  build-android:
    if: ${{ !inputs.macos_verify_only }}
    runs-on: ubuntu-latest
    needs: [get-release]
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned Rust dependencies
        run: git submodule update --init --jobs 4 deps/portmapper deps/quinn deps/rcgen deps/stun-proto
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;36.0.0'
      - name: Install Android NDK
        run: sdkmanager --install 'ndk;28.2.13676358'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          targets: armv7-linux-androideabi,aarch64-linux-android,x86_64-linux-android
      - name: Build fresh Android FFI libraries
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          cargo install cargo-ndk --version 4.1.2 --locked
          cargo ndk -o ui/native/android -t armeabi-v7a -t arm64-v8a -t x86_64 \
            build -p pb-mapper-ffi --release --locked
      - name: Build APKs with the persistent signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo '::error::ANDROID_KEYSTORE_BASE64 is not set'; exit 1; }
          umask 077
          key="$RUNNER_TEMP/pb-mapper-android.keystore"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key"
          unset ANDROID_KEYSTORE_BASE64
          export PB_MAPPER_ANDROID_KEYSTORE="$key"
          cd ui
          flutter pub get --enforce-lockfile
          flutter build apk --release --split-per-abi \
            --target-platform android-arm,android-arm64,android-x64 --no-pub
      - name: Verify APKs and upgrade compatibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(awk '/^version:/ { split($2, v, "+"); print v[1] }' ui/pubspec.yaml)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [ "$GITHUB_EVENT_NAME" = push ]; then test "v$version" = "$GITHUB_REF_NAME"; fi
          mkdir -p artifacts/android artifacts/previous
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          previous="$(python3 scripts/release/ui_release_manifest.py previous-android-release "$version" "$RUNNER_TEMP/releases.json")"
          gh release download "$previous" --repo "$GITHUB_REPOSITORY" --dir artifacts/previous \
            --pattern 'release-manifest.json' --pattern 'release-manifest.json.sig'
          python3 scripts/release/ui_release_manifest.py verify artifacts/previous/release-manifest.json \
            --public-key scripts/release/update_signing_key.pub.pem
          python3 - "$previous" <<'PY'
          import json, sys
          from pathlib import Path
          previous = json.loads(Path('artifacts/previous/release-manifest.json').read_text())
          if previous['tag'] != sys.argv[1]:
              raise SystemExit('Previous signed manifest does not match its release')
          PY
          for abi in armeabi-v7a arm64-v8a x86_64; do
            apk="artifacts/android/pb-mapper-$abi.apk"
            cp "ui/build/app/outputs/flutter-apk/app-$abi-release.apk" "$apk"
            unzip -tq "$apk"
            "$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" \
              --strip-unneeded -o "$RUNNER_TEMP/ffi-stripped.so" "ui/native/android/$abi/libpb_mapper_ffi.so"
            unzip -p "$apk" "lib/$abi/libpb_mapper_ffi.so" > "$RUNNER_TEMP/ffi-packaged.so"
            cmp "$RUNNER_TEMP/ffi-stripped.so" "$RUNNER_TEMP/ffi-packaged.so"
          done
          python3 - "$version" <<'PY'
          import json, sys
          from pathlib import Path
          Path('artifacts/check-manifest.json').write_text(json.dumps({'version': sys.argv[1], 'assets': []}))
          PY
          python3 scripts/release/ui_release_manifest.py add-android artifacts/check-manifest.json artifacts/android/*.apk \
            --build-tools "$ANDROID_HOME/build-tools/36.0.0" --previous-manifest artifacts/previous/release-manifest.json
      - name: Save verified Android packages
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: artifacts/
          if-no-files-found: error

  # Verify the same complete manifest in an Android-only manual run, but only
  # a tag push may attach packages or a manifest to a release.
  publish-manifest:
    if: >-
      ${{ always() && needs.build-android.result == 'success' &&
          (inputs.android_verify_only ||
           (github.event_name == 'push' && needs.build-windows.result == 'success' &&
            needs.build-linux.result == 'success' && needs.build-macos.result == 'success')) }}
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-macos, build-android]
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;36.0.0'
      - uses: actions/download-artifact@v4
        with:
          name: android-release
          path: release
      - name: Select the source and UI release
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            source_tag="$GITHUB_REF_NAME"
            release="$source_tag-ui"
          else
            version="$(awk '/^version:/ { split($2, v, "+"); print v[1] }' ui/pubspec.yaml)"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            source_tag="v$version"
            # A pre-release branch may not have a UI release yet. Use the
            # previous release's desktop files only for this unpublished check.
            release="$(python3 -c 'import json; print(json.load(open("release/previous/release-manifest.json"))["tag"])')"
            [[ "$release" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-ui$ ]]
          fi
          echo "SOURCE_TAG=$source_tag" >> "$GITHUB_ENV"
          echo "RELEASE=$release" >> "$GITHUB_ENV"
      - name: Collect the release's packages
        run: |
          gh release download "$RELEASE" --repo "$GITHUB_REPOSITORY" --dir release/desktop \
            --pattern 'pb-mapper-linux*' --pattern 'pb-mapper-windows*' --pattern 'pb-mapper-macos*'
      - name: Write the complete release manifest
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(release/android/*.apk)
          test "${#apks[@]}" -eq 3
          python3 scripts/release/ui_release_manifest.py build release/desktop "$SOURCE_TAG" "$GITHUB_SHA"
          python3 scripts/release/ui_release_manifest.py add-android release/desktop/release-manifest.json "${apks[@]}" \
            --build-tools "$ANDROID_HOME/build-tools/36.0.0" --previous-manifest release/previous/release-manifest.json
      - name: Sign the release manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          test -n "$UPDATE_SIGNING_KEY" || { echo "::error::UPDATE_SIGNING_KEY is not set"; exit 1; }
          KEY=$(mktemp)
          trap 'rm -f "$KEY"' EXIT
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$KEY"
          python3 scripts/release/ui_release_manifest.py sign release/desktop/release-manifest.json --key "$KEY"
          python3 scripts/release/ui_release_manifest.py verify release/desktop/release-manifest.json --public-key scripts/release/update_signing_key.pub.pem
      - name: Attach Android packages without replacing existing assets
        if: github.event_name == 'push'
        run: python3 scripts/release/release_assets.py upload --repo "$GITHUB_REPOSITORY" --tag "$RELEASE" release/android/*.apk
      - name: Attach the manifest
        if: github.event_name == 'push'
        run: |
          gh release upload "$RELEASE" release/desktop/release-manifest.json release/desktop/release-manifest.json.sig --repo "$GITHUB_REPOSITORY" --clobber
          python3 scripts/release/release_assets.py verify --repo "$GITHUB_REPOSITORY" --tag "$RELEASE" release/desktop/release-manifest.json release/desktop/release-manifest.json.sig
      - name: Save verified manifest
        if: ${{ inputs.android_verify_only }}
        uses: actions/upload-artifact@v4
        with:
          name: android-manifest-verification
          path: release/desktop/release-manifest.json*
          if-no-files-found: error
