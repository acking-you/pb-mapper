name: Build and Push pb-mapper Docker Images

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  # Joins the architectures of a release that is already published, without
  # building anything.
  workflow_dispatch:
    inputs:
      tag:
        description: "Released tag whose multi-arch tags to (re)publish, e.g. v0.11.0"
        required: true
        type: string

env:
  REGISTRY: docker.io
  IMAGE_NAME: ackingliu/pb-mapper

permissions:
  contents: read

jobs:
  build-and-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - arch: x86_64
            platform: linux/amd64
            suffix: x86_64_musl
          - arch: aarch64
            platform: linux/arm64
            suffix: aarch64_musl
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify release tag matches Cargo version
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(awk '
            /^\[workspace.package\]$/ { in_workspace = 1; next }
            in_workspace && /^version = / {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' Cargo.toml)"
          test "${GITHUB_REF_NAME}" = "v${package_version}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build pb-mapper binary
        uses: houseabsolute/actions-rust-cross@v1
        with:
          target: ${{ matrix.target.arch }}-unknown-linux-musl
          toolchain: 1.99.1
          args: "--locked --release --bin pb-mapper"
          strip: true

      - name: Prepare files for Docker build
        run: |
          # Copy binary to expected location for Docker build
          mkdir -p target/release
          cp target/${{ matrix.target.arch }}-unknown-linux-musl/release/pb-mapper target/release/
          cp scripts/release/entrypoint/pb-mapper.sh target/release/

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          # Every tag from a leg carries its architecture. The tags without
          # one are joined from both by publish-multi-arch below; left to the
          # default, each leg would push its own `latest` over the other's.
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag,suffix=-${{ matrix.target.suffix }}
            type=semver,pattern={{version}},suffix=-${{ matrix.target.suffix }}
            type=semver,pattern={{major}}.{{minor}},suffix=-${{ matrix.target.suffix }}
            type=semver,pattern={{major}},suffix=-${{ matrix.target.suffix }}
            type=raw,value=latest,suffix=-${{ matrix.target.suffix }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/pb-mapper.dockerfile
          platforms: ${{ matrix.target.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-multi-arch:
    needs: build-and-push
    # A manual run skips the build, and a skipped dependency skips this job
    # too unless its condition calls a status function.
    if: ${{ !cancelled() && (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Each tag without an architecture is the join of its two suffixed
      # twins, whatever they hold by now, so a run for an older release moves
      # nothing backwards.
      - name: Join the architectures under one tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::not a release tag: ${RELEASE_TAG}"
            exit 1
          fi
          # Docker Hub also holds complete tag sets of versions that were
          # never released; a manual run must not publish from those.
          if ! git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "::error::no such release tag in this repository: ${RELEASE_TAG}"
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          for name in "${RELEASE_TAG}" "${version}" "${version%.*}" "${version%%.*}" latest; do
            docker buildx imagetools create --tag "${IMAGE_NAME}:${name}" \
              "${IMAGE_NAME}:${name}-x86_64_musl" \
              "${IMAGE_NAME}:${name}-aarch64_musl"
          done

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: ackingliu/pb-mapper
          short-description: "pb-mapper network tunneling server - expose local services through a public server"
          readme-filepath: ./DOCKER_README.md
