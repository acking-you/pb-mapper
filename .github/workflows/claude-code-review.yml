name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Review pull request
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check Claude gateway configuration
        shell: bash
        env:
          CLAUDE_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          CLAUDE_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          missing=0
          if [[ -z "$CLAUDE_BASE_URL" ]]; then
            echo "::error::Repository secret ANTHROPIC_BASE_URL is not configured."
            missing=1
          fi
          if [[ -z "$CLAUDE_API_KEY" ]]; then
            echo "::error::Repository secret ANTHROPIC_API_KEY is not configured."
            missing=1
          fi
          exit "$missing"

      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          # The focused reviewer compares against origin/<base>; make that ref
          # available up front so Claude never spends turns trying to fetch it.
          fetch-depth: 0

      - name: Run Claude review
        id: claude-review
        # v1.0.191; pin the action because this job receives an API credential.
        uses: anthropics/claude-code-action@239e3a730883eeb5c53db12b0fc9573b3024b126
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_CUSTOM_HEADERS: ${{ secrets.ANTHROPIC_CUSTOM_HEADERS }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Use the job-scoped token so a PR that updates this workflow can
          # still be reviewed. The action's OIDC app-token exchange otherwise
          # treats a workflow mismatch as a successful skip.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read AGENTS.md, CLAUDE.md, and other
            repository guidance first when present. Review only the PR changes
            and directly affected code. Do not modify files or push commits.

            SPEED AND SCOPE ARE HARD REQUIREMENTS:
            - Finish in one focused pass. Do not perform broad repository
              exploration or repeatedly revisit files.
            - Start with diff statistics and name/status only, using
              `origin/${{ github.event.pull_request.base.ref }}...HEAD` as the
              comparison range. That ref is already available: never run
              `git fetch`, `git log`, `git branch`, or `git merge-base`. Never
              load or print the complete PR diff.
            - Select at most 10 high-risk modified or added files based on the
              PR purpose and diff statistics. Inspect only their changed hunks
              with path-scoped `git diff` commands.
            - Skip the bodies of deleted legacy files, generated files,
              mechanical changes, and unrelated tests. Follow a definition or
              caller only when a changed hunk cannot be evaluated without it,
              and stop after the nearest relevant dependency.
            - Do not spend turns on progress narration or speculative findings.
              If the review context is becoming large, stop investigating and
              report only findings already confirmed from changed lines.

            Prioritize actionable findings over summaries or style preferences:
            - correctness bugs and behavioral regressions
            - security, trust-boundary, and secret-handling problems
            - concurrency, cancellation, and resource-lifecycle issues
            - protocol, API, data, and backward-compatibility problems
            - missing tests for risky behavior

            For each finding, state the severity, explain the concrete failure
            scenario, and point to the narrowest relevant changed line. Use
            mcp__github_inline_comment__create_inline_comment with confirmed=true
            for line-specific findings. Use `gh pr comment` for one concise
            top-level summary. If there are no actionable findings, post only a
            short approval-style summary. Post review text only as GitHub PR
            comments.
          claude_args: |
            --model "${{ vars.CLAUDE_MODEL || 'claude-sonnet-5' }}"
            --max-turns 100
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(git diff:*),Bash(gh pr comment:*),Bash(gh pr view:*)"

      - name: Require completed Claude review
        if: always()
        shell: bash
        env:
          REVIEW_CONCLUSION: ${{ steps.claude-review.outputs.conclusion }}
        run: |
          if [[ "$REVIEW_CONCLUSION" != "success" ]]; then
            echo "::error::Claude review did not complete successfully (conclusion: ${REVIEW_CONCLUSION:-missing})."
            exit 1
          fi
