name: Syntax Check

on:
  push:
    branches: [ "**" ]
    tags-ignore: [ "**" ]  # Don't run on tag pushes
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  # Which half of the repo moved. A Dart-only change has no business spending
  # several minutes building the Rust workspace, and the reverse holds too.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      flutter: ${{ steps.filter.outputs.flutter }}
      node: ${{ steps.filter.outputs.node }}
      android: ${{ steps.filter.outputs.android }}
      linux: ${{ steps.filter.outputs.linux }}
      apple: ${{ steps.filter.outputs.apple }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        shell: bash
        run: |
          set -euo pipefail

          # Resolve something to diff against. Anything we cannot resolve — a
          # brand new branch, a force push, a rewritten history — falls through
          # to checking everything, because guessing wrong here means shipping
          # an untested change.
          base=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi

          if [ -z "$base" ] \
            || [ "$base" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "No usable base commit; checking everything."
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "flutter=true" >> "$GITHUB_OUTPUT"
            echo "node=true" >> "$GITHUB_OUTPUT"
            echo "android=true" >> "$GITHUB_OUTPUT"
            echo "linux=true" >> "$GITHUB_OUTPUT"
            echo "apple=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "$base" HEAD)"
          echo "Changed files:"
          echo "$changed"

          rust=false
          flutter=false
          node=false
          android=false
          linux=false
          apple=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              # pb-mapper-ffi lives under ui/ but is a workspace member, so it
              # belongs to the Rust side and must be matched before ui/*. Its
              # JNI layer compiles only for Android; the Linux runner loads
              # its video exports and the Apple apps link it.
              ui/native/pb_mapper_ffi/*) rust=true; android=true; linux=true; apple=true ;;
              ui/native/*) rust=true ;;
              # The plugin set is part of the Gradle, the Linux and the Xcode
              # builds.
              ui/pubspec.yaml|ui/pubspec.lock) flutter=true; android=true; linux=true; apple=true ;;
              ui/android/*) flutter=true; android=true ;;
              # The Linux runner and its GStreamer video module.
              ui/linux/*|scripts/build/check-linux-bundle.sh|scripts/test/linux-desktop-video.sh) flutter=true; linux=true ;;
              # The Apple runners and the video decoder they share.
              ui/macos/*|ui/ios/*|ui/darwin/*) flutter=true; apple=true ;;
              ui/*) flutter=true ;;
              js/*) node=true ;;
              # The Node-API addon is a workspace crate; SDK changes must also
              # run the JS e2e, because the addon is a thin wrap over it.
              # Its transitive dependencies count too: the JS e2e runs against a
              # real relay, so a change to any layer below the SDK — or to the
              # server that relay is — can break the JS path or the addon size
              # while every Rust check still passes.
              crates/pb-mapper-node/*|crates/pb-mapper-client/*|crates/pb-mapper/*) rust=true; node=true ;;
              crates/pb-mapper-core/*|crates/pb-mapper-auth/*|crates/pb-mapper-protocol/*|crates/pb-mapper-server/*) rust=true; node=true ;;
              # The JNI layer pulls its video units from this crate.
              crates/pb-mapper-desktop/*) rust=true; android=true ;;
              crates/*|src/*|tests/*|examples/*) rust=true ;;
              # The addon is built from this workspace, and `bun run
              # build:release` consumes the root `release-node` profile — a
              # profile or lockfile change that pushes it past the size limit
              # has to be caught here, not after release.
              Cargo.toml|Cargo.lock|rust-toolchain.toml|deps/*|.gitmodules) rust=true; node=true; android=true ;;
              rustfmt.toml) rust=true ;;
              # Per-crate manifests. `case` patterns match the whole path, so
              # the unanchored entry above only ever catches the root manifest.
              */Cargo.toml|*/Cargo.lock) rust=true ;;
              # A change to this workflow has to prove itself on every job.
              .github/workflows/syntax-check.yml) rust=true; flutter=true; node=true; android=true; linux=true; apple=true ;;
            esac
          done <<< "$changed"

          echo "rust=$rust"
          echo "flutter=$flutter"
          echo "node=$node"
          echo "android=$android"
          echo "linux=$linux"
          echo "apple=$apple"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "flutter=$flutter" >> "$GITHUB_OUTPUT"
          echo "node=$node" >> "$GITHUB_OUTPUT"
          echo "android=$android" >> "$GITHUB_OUTPUT"
          echo "linux=$linux" >> "$GITHUB_OUTPUT"
          echo "apple=$apple" >> "$GITHUB_OUTPUT"

  rust-syntax-check:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      # --all-targets, so the test code is linted too. It was excluded before,
      # which left the largest untested-by-clippy surface in the repo.
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features

      # The SDK's desktop quickstart: a relay, a host of a synthetic backend
      # and a viewer in one process, through control, input, a preset change
      # and pause. It exits non-zero when a step does not do what it should.
      - name: Run the desktop loopback example
        run: cargo run -p pb-mapper --features desktop --example desktop_loopback

      # The SDK release refuses to publish unless the docs build cleanly, so
      # a broken doc link has to fail here, not on the release tag.
      - name: Build docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

  # The remote desktop's host side (capture, encoder, helper, DPAPI vaults)
  # and its acceptance examples compile only on Windows, so the Linux job
  # above never builds, lints or tests them.
  rust-windows-desktop:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: 0  # Incremental state only bloats the cached target/
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: clippy

      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-desktop-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-desktop-

      # Only these two packages: the rest of the workspace has a few
      # cfg(windows) lines at most, and its known Windows flakes (pb-mapper-cli's
      # regression tests, pb-mapper-client's direct test) would only add noise.
      - name: Run Clippy
        run: cargo clippy -p pb-mapper-desktop -p pb-mapper-ffi --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test -p pb-mapper-desktop -p pb-mapper-ffi --all-features

  # The remote desktop's macOS host (ScreenCaptureKit, VideoToolbox, CGEvent,
  # the Keychain) compiles only on macOS. Its tests need no person: the
  # encoder and the display list run; capture and input need the owner's
  # Screen Recording and Accessibility grants, which a runner never has, and
  # are covered by the manual checklist.
  rust-macos-desktop:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-latest
    env:
      CARGO_INCREMENTAL: 0  # Incremental state only bloats the cached target/
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: clippy

      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-desktop-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-desktop-

      - name: Run Clippy
        run: cargo clippy -p pb-mapper-desktop -p pb-mapper-ffi --all-targets --all-features -- -D warnings

      # DIAGNOSTIC (temporary): the runner's timer settings, and the session
      # binary's pacing tests alone, one at a time.
      - name: Diagnose session pacing (temporary)
        continue-on-error: true
        run: |
          sysctl hw.ncpu hw.model || true
          sysctl -a 2>/dev/null | grep -i coalesc || true
          ps -o pid,ni,pri,comm -p $$ || true
          cargo test -p pb-mapper-desktop --all-features --test session -- --test-threads=1 frozen_renderer pacing_probe

      # DIAGNOSTIC (temporary): the probe overrides the process's timer QoS,
      # so it runs only alone, above.
      - name: Run tests
        run: cargo test -p pb-mapper-desktop -p pb-mapper-ffi --all-features -- --skip pacing_probe

      # The app runs from macOS 10.15, ScreenCaptureKit arrived in 12.3: the
      # FFI library must link it weakly, or it would not load before 12.3.
      - name: Check ScreenCaptureKit is linked weakly
        run: |
          cargo build -p pb-mapper-ffi
          kind="$(otool -l target/debug/libpb_mapper_ffi.dylib \
            | awk '/^ *cmd LC_/ { cmd = $2 } /name .*ScreenCaptureKit/ { print cmd }')"
          echo "ScreenCaptureKit load command: ${kind:-none}"
          test "$kind" = "LC_LOAD_WEAK_DYLIB"

  node-e2e:
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1

      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-node-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-node-
            ${{ runner.os }}-cargo-

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Build relay binary for N-API e2e
        run: cargo build --bin pb-mapper

      - name: Build addon and run N-API tests
        working-directory: js
        env:
          CI: true
          PB_MAPPER_BIN: ${{ github.workspace }}/target/debug/pb-mapper
        run: |
          bun install --frozen-lockfile
          bun run build:release
          bun test
          # Includes optional PCP/NAT-PMP/UPnP support (HTTP/XML for UPnP).
          # Measured Linux x64 release-node size: 6,244,712 bytes, Rust 1.99.1.
          bun -e "const fs = require('fs'); const f = fs.readdirSync('.').find((n) => n.endsWith('.node')); const s = fs.statSync(f).size; console.log(f, s); if (s > 7 * 1024 * 1024) { console.error('addon larger than 7 MiB'); process.exit(1); }"

  flutter-syntax-check:
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1  # Shallow clone for faster checkout

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Matches the version the project is developed against (ui/.dart_tool
          # records the same). A CI on an older SDK green-lights code the
          # local toolchain would reject, and vice versa.
          flutter-version: 3.44.9
          channel: "stable"
          cache: true  # Enable Flutter SDK cache

      - name: Cache Flutter dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Get Flutter dependencies
        run: flutter pub get

      # gen-l10n falls back to English for a key app_zh.arb lacks and still
      # exits 0; the untranslated file it writes is the only trace.
      - name: Refuse untranslated UI strings
        run: |
          flutter gen-l10n
          if [ "$(tr -d '[:space:]' < l10n_untranslated.json)" != '{}' ]; then
            cat l10n_untranslated.json
            echo "::error::UI strings without a translation; see l10n_untranslated.json"
            exit 1
          fi

      # After gen-l10n, so the generated app_localizations*.dart are checked
      # too. packages/ holds a vendored plugin, kept as upstream wrote it.
      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Run Flutter analyzer
        run: flutter analyze --no-fatal-infos

      # Icons are Lucide only, through lib/src/theme/app_icons.dart: the tests
      # and posters load no Material icon font, so an Icons.* glyph would show
      # there as a box.
      - name: Refuse Material icons
        run: |
          if grep -rnE '\bIcons\.' lib; then
            echo "::error::Material Icons.* found; use AppIcons from lib/src/theme/app_icons.dart"
            exit 1
          fi

      - name: Run widget tests
        run: flutter test

  # The Android half of the native video path: the Kotlin feeder and keystore
  # with their JVM unit tests, and pb-mapper-ffi's JNI layer, which compiles
  # only for Android. release-ui's build-android is the only other place
  # either one compiles, at a tag, and it never runs the unit tests.
  android-check:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The NDK release-ui pins. Naming a package also keeps the action off
      # its default, the retired "tools".
      - uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;28.2.13676358'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: clippy
          targets: aarch64-linux-android

      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-android-

      # Clippy, not check: the workspace's unwrap/expect denial is a lint, and
      # no other job lints this Android-only code.
      - name: Lint the Android JNI layer
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          cargo install cargo-ndk --version 4.1.2 --locked
          cargo ndk -t arm64-v8a clippy -p pb-mapper-ffi --locked -- -D warnings

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: "stable"
          cache: true

      - uses: gradle/actions/setup-gradle@v4

      # --config-only writes the git-ignored gradlew, wrapper jar and
      # local.properties without building anything.
      - name: Generate the Gradle wrapper
        working-directory: ui
        run: |
          flutter pub get
          flutter build apk --config-only

      - name: Run the Android unit tests
        working-directory: ui/android
        run: ./gradlew :app:testDebugUnitTest

  # The Linux runner and its GStreamer video module (ui/linux), which nothing
  # else compiles before a release tag, on the image release-ui builds on:
  # the app with the FFI, the bundle's native libraries, and clips decoded
  # through the module by the FFI's test source (software decoders here).
  linux-app:
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1

      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-linux-app-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-linux-app-

      # release-ui's packages for the app, then what the clip test decodes
      # with: gst-libav, the parsers in gst-plugins-bad, ffmpeg for the clips.
      # libunwind-dev goes first, by name: the runner image ships LLVM's
      # libunwind-14-dev, which apt will not swap out on its own for the one
      # libgstreamer1.0-dev depends on.
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libunwind-dev
          sudo apt-get install -y ninja-build libgtk-3-dev libayatana-appindicator3-dev libnotify-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-libav gstreamer1.0-plugins-bad ffmpeg

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: "stable"
          cache: true

      - name: Build the FFI library
        run: |
          cargo build -p pb-mapper-ffi
          mkdir -p ui/native/linux/x64
          cp target/debug/libpb_mapper_ffi.so ui/native/linux/x64/

      - name: Build the Linux app
        working-directory: ui
        run: |
          flutter pub get
          flutter build linux --debug

      - name: Check the bundle's native libraries
        run: bash scripts/build/check-linux-bundle.sh ui/build/linux/x64/debug/bundle

      - name: Decode clips through the video module
        run: bash scripts/test/linux-desktop-video.sh --software

  # The Apple apps: the macOS and the iOS runner with the video decoder they
  # share (ui/darwin/DesktopVideo.swift), linked against the FFI library each
  # takes. release-ui builds the macOS app only at a tag and never builds iOS.
  macos-app:
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    runs-on: macos-latest
    env:
      CARGO_INCREMENTAL: 0  # Incremental state only bloats the cached target/
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1

      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-macos-app-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-macos-app-

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: "stable"
          cache: true

      - name: Cache Flutter dependencies
        uses: actions/cache@v3
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      # release-ui's recipe: the dylib for the runner's architecture, staged
      # in ui/native/macos for the Xcode project to link and embed.
      - name: Build the FFI library
        run: bash scripts/build/pb-mapper-ffi-macos.sh

      # The host architecture only, as the Makefile builds it: the dylib has
      # no other slice.
      - name: Build the macOS app
        working-directory: ui
        run: |
          set -euo pipefail
          flutter pub get
          FLUTTER_XCODE_ARCHS="$(uname -m)" FLUTTER_XCODE_ONLY_ACTIVE_ARCH=YES \
            flutter build macos --debug
          test -f build/macos/Build/Products/Debug/pb-mapper.app/Contents/Frameworks/libpb_mapper_ffi.dylib

  ios-app:
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    runs-on: macos-latest
    env:
      CARGO_INCREMENTAL: 0  # Incremental state only bloats the cached target/
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          targets: aarch64-apple-ios

      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-ios-app-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ios-app-

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: "stable"
          cache: true

      - name: Cache Flutter dependencies
        uses: actions/cache@v3
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      # The aarch64-apple-ios static library, staged in ui/native/ios for
      # ui/ios/Flutter/PbMapperFfi.xcconfig to link.
      - name: Build the FFI static library
        run: bash scripts/build/pb-mapper-ffi-ios.sh

      - name: Build the iOS app without signing
        working-directory: ui
        run: |
          set -euo pipefail
          flutter pub get
          flutter build ios --debug --no-codesign

      # Dart and the video decoder find the FFI by name at run time only, so a
      # link that drops it still succeeds: check that the app kept it, exported.
      - name: Check that the app exports the FFI
        working-directory: ui/build/ios/iphoneos/Runner.app
        run: |
          set -euo pipefail
          exports="$(for image in Runner Runner.debug.dylib; do
            if [ -f "$image" ]; then nm -gU "$image"; fi
          done)"
          for symbol in _pb_mapper_create _pb_mapper_desktop_video_next_v1 _pb_mapper_desktop_instance_token_v1; do
            if ! grep -q " T ${symbol}\$" <<< "$exports"; then
              echo "::error::${symbol} is not exported by the iOS app"
              exit 1
            fi
          done

  release-package-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check release package boundaries
        run: python -m unittest discover -s scripts/release -p 'test_*.py' -v
