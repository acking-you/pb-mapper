services:
  pb-mapper:
    container_name: pb-mapper
    # The release workflow moves this tag at every release. It is one image
    # for linux/amd64 and linux/arm64.
    image: ackingliu/pb-mapper:latest
    environment:
      PB_MAPPER_PORT: 7666
      # Keep the machine-derived key on first boot of an empty auth volume so
      # recreating this service does not mint a new administrator key.
      USE_MACHINE_MSG_HEADER_KEY: true
      RUST_LOG: error
      # Send the relay's TCP connections with BBR, which random loss on a long
      # path does not slow as it does Linux's default, Cubic. The host needs
      # the tcp_bbr module (`modprobe tcp_bbr`) and either bbr in its
      # net.ipv4.tcp_allowed_congestion_control or `cap_add: [NET_ADMIN]` here.
      # A refusal is logged as an error, relay_tcp_congestion_unavailable.
      # PB_MAPPER_TCP_CONGESTION: bbr
    volumes:
      - pb-mapper-auth:/var/lib/pb-mapper/auth
      - pb-mapper-legacy:/var/lib/pb-mapper-server
    ports:
      - "7666:7666/tcp"
      # Direct (peer-to-peer) coordination uses the same port number over UDP.
      - "7666:7666/udp"
    sysctls:
      # Keep an idle TCP connection's congestion window, so what the relay
      # sends after a pause, such as a remote desktop's next picture, does not
      # start slowly again. It applies to this container's network namespace
      # only, which needs Linux 4.15 or later (remove it on an older kernel,
      # where the container would not start) and cannot be set with
      # network_mode: host. Where a user-space proxy carries the port
      # (docker-proxy for IPv6 without ip6tables, rootless Docker or Podman),
      # the viewer's connection ends on the host: set it on the host instead.
      net.ipv4.tcp_slow_start_after_idle: 0
    restart: unless-stopped

volumes:
  pb-mapper-auth:
  pb-mapper-legacy:
