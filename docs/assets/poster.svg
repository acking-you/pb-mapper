<svg width="1672" height="941" viewBox="0 0 1672 941" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">pb-mapper — pull a virtual network cable to any service</title>
  <desc id="desc">Two endpoints joined by a direct QUIC cable when the connection opts in and the network allows it, with the relay as the fallback path.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1672" y2="941" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050B24"/>
      <stop offset="0.55" stop-color="#0A1A55"/>
      <stop offset="1" stop-color="#1647C8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1210 430) rotate(90) scale(520 640)">
      <stop offset="0" stop-color="#2E7BFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2E7BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0876D9"/>
      <stop offset="1" stop-color="#30B2FF"/>
    </linearGradient>
    <linearGradient id="cable" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#29E3FF"/>
      <stop offset="1" stop-color="#5AA9FF"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <symbol id="mark" viewBox="0 0 1024 1024">
      <path d="M687 514C779 511 855 574 855 677C855 791 744 843 639 811C581 793 543 755 498 716C414 644 316 655 250 748" stroke="white" stroke-width="43" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <rect x="382" y="326" width="44" height="119" rx="19" fill="white"/>
      <rect x="581" y="326" width="44" height="119" rx="19" fill="white"/>
      <rect x="328" y="400" width="368" height="228" rx="59" fill="white"/>
      <path d="M414 501L456 535L414 565" stroke="#168BE5" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M596 501L554 535L596 565" stroke="#168BE5" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </symbol>
  </defs>

  <rect width="1672" height="941" fill="url(#bg)"/>
  <rect width="1672" height="941" fill="url(#glow)"/>

  <!-- Brand -->
  <rect x="92" y="96" width="176" height="176" rx="40" fill="#F4F8FF"/>
  <rect x="106" y="110" width="148" height="148" rx="32" fill="url(#icon)"/>
  <use href="#mark" x="106" y="110" width="148" height="148"/>
  <text x="304" y="214" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="92" font-weight="700" fill="#FFFFFF">pb-mapper</text>

  <text x="92" y="398" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="50" font-weight="500" fill="#FFFFFF">Pull a virtual network cable</text>
  <text x="92" y="458" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="50" font-weight="500" fill="#FFFFFF">to any service.</text>
  <text x="92" y="522" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" fill="#3FE0FF">Direct end to end when you choose it · relay when direct can't connect</text>

  <!-- Chips -->
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" fill="#E6EEFF" text-anchor="middle">
    <rect x="92" y="574" width="220" height="66" rx="14" fill="#0E1E5C" stroke="#2C4BB0"/>
    <text x="202" y="614">Opt-in QUIC direct</text>
    <rect x="326" y="574" width="184" height="66" rx="14" fill="#0E1E5C" stroke="#2C4BB0"/>
    <text x="418" y="614">Relay fallback</text>
    <rect x="524" y="574" width="226" height="66" rx="14" fill="#0E1E5C" stroke="#2C4BB0"/>
    <text x="637" y="614">Scoped credentials</text>
    <rect x="764" y="574" width="146" height="66" rx="14" fill="#0E1E5C" stroke="#2C4BB0"/>
    <text x="837" y="614">TCP / UDP</text>
  </g>

  <text x="92" y="722" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" fill="#9FB4E8">Relay-only by default. Direct needs the relay's UDP service, a publisher that allows it,</text>
  <text x="92" y="752" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" fill="#9FB4E8">and a connect that asks for it — per connection.</text>

  <!-- Diagram -->
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <!-- direct cable -->
    <path d="M1100 300 C1230 230 1370 230 1500 300" stroke="#29E3FF" stroke-width="16" stroke-linecap="round" filter="url(#soft)" opacity="0.55"/>
    <path d="M1100 300 C1230 230 1370 230 1500 300" stroke="url(#cable)" stroke-width="7" stroke-linecap="round"/>
    <text x="1300" y="168" text-anchor="middle" font-size="24" font-weight="600" fill="#3FE0FF">direct · QUIC end to end</text>
    <text x="1300" y="200" text-anchor="middle" font-size="18" fill="#9FB4E8">owned by the two endpoints</text>

    <!-- relay fallback -->
    <path d="M1080 360 C1120 520 1200 560 1260 580" stroke="#7C93D6" stroke-width="5" stroke-dasharray="14 12" stroke-linecap="round"/>
    <path d="M1520 360 C1480 520 1400 560 1340 580" stroke="#7C93D6" stroke-width="5" stroke-dasharray="14 12" stroke-linecap="round"/>
    <text x="1300" y="470" text-anchor="middle" font-size="22" fill="#C9D6FF">fallback before commit</text>

    <!-- endpoints -->
    <rect x="960" y="270" width="180" height="96" rx="20" fill="#0E1E5C" stroke="#3FE0FF" stroke-width="2"/>
    <text x="1050" y="312" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">connect</text>
    <text x="1050" y="343" text-anchor="middle" font-size="18" fill="#9FB4E8">local port</text>
    <rect x="1460" y="270" width="180" height="96" rx="20" fill="#0E1E5C" stroke="#3FE0FF" stroke-width="2"/>
    <text x="1550" y="312" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">register</text>
    <text x="1550" y="343" text-anchor="middle" font-size="18" fill="#9FB4E8">private service</text>

    <!-- relay hub -->
    <rect x="1220" y="560" width="160" height="160" rx="36" fill="url(#icon)" stroke="#9CCBFF" stroke-width="2"/>
    <use href="#mark" x="1236" y="572" width="128" height="128"/>
    <text x="1300" y="762" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">relay</text>
    <text x="1300" y="792" text-anchor="middle" font-size="18" fill="#9FB4E8">coordinates · one public port · Rust/Tokio forwarding</text>
  </g>

  <!-- Footer -->
  <g transform="translate(92 830)">
    <path fill="#FFFFFF" d="M20 0C9 0 0 9 0 20c0 8.8 5.7 16.3 13.7 19 1 .2 1.4-.4 1.4-1v-3.4c-5.6 1.2-6.7-2.4-6.7-2.4-.9-2.3-2.2-2.9-2.2-2.9-1.8-1.2.1-1.2.1-1.2 2 .1 3.1 2.1 3.1 2.1 1.8 3.1 4.7 2.2 5.8 1.7.2-1.3.7-2.2 1.3-2.7-4.4-.5-9.1-2.2-9.1-9.9 0-2.2.8-4 2.1-5.4-.2-.5-.9-2.6.2-5.3 0 0 1.7-.5 5.5 2.1 1.6-.4 3.3-.7 5-.7s3.4.2 5 .7c3.8-2.6 5.5-2.1 5.5-2.1 1.1 2.8.4 4.8.2 5.3 1.3 1.4 2.1 3.2 2.1 5.4 0 7.7-4.7 9.4-9.2 9.9.7.6 1.4 1.9 1.4 3.7v5.5c0 .5.4 1.2 1.4 1C34.3 36.3 40 28.8 40 20 40 9 31 0 20 0z"/>
    <text x="58" y="29" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" fill="#FFFFFF">github.com/acking-you/pb-mapper</text>
  </g>
</svg>
