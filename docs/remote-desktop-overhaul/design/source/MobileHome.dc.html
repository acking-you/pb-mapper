<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>手机 · 远程标签页</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F4F4F2; font-family: Inter, 'Noto Sans SC', system-ui, sans-serif; color: #1D1D1F">
  <div style="padding: 54px 16px 0; display: flex; flex-direction: column; gap: 12px">
    <header style="display: flex; align-items: center; height: 48px">
      <h1 style="margin: 0; flex: 1; font-size: 28px; font-weight: 700">远程</h1>
      <button type="button" aria-label="添加电脑" style="width: 40px; height: 40px; border-radius: 20px; border: none; background: #1D1D1F; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
    </header>

    <article style="border-radius: 20px; background: #FFFFFF; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,0.04)">
      <div style="position: relative; height: 201px">
        <dc-import name="RemoteScreen" cursor="{{ false }}" hint-size="358px,201px"></dc-import>
        <span style="position: absolute; left: 10px; top: 10px; height: 24px; display: inline-flex; align-items: center; padding: 0 10px; border-radius: 12px; background: rgba(20,20,22,0.7); color: #FFFFFF; font-size: 11.5px">上次画面 · 今天 09:12</span>
      </div>
      <div style="padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; align-items: center; gap: 10px">
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 17px; font-weight: 600">办公室电脑</div>
            <div style="font-size: 12.5px; color: #4A4A4D; margin-top: 3px">直连 · 可以查看和控制</div>
          </div>
          <span style="display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 12px; background: #E3F2E7; color: #1A7F37; font-size: 12px; font-weight: 500"><span style="width: 6px; height: 6px; border-radius: 3px; background: #1A7F37"></span>在线</span>
        </div>
        <button type="button" style="height: 46px; border-radius: 23px; border: none; background: #1D1D1F; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 600">打开</button>
      </div>
    </article>

    <div style="font-size: 13px; color: #4A4A4D; padding: 6px 4px 0">其他电脑</div>
    <div style="border-radius: 20px; background: #FFFFFF; padding: 4px 0; box-shadow: 0 1px 2px rgba(0,0,0,0.04)">
      <a href="#" style="display: flex; align-items: center; gap: 12px; height: 64px; padding: 0 16px; color: inherit; text-decoration: none">
        <span style="width: 40px; height: 40px; border-radius: 11px; background: #F2F2F0; color: #4A4A4D; display: flex; align-items: center; justify-content: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="13" rx="2"></rect><path d="M8 21h8M12 17v4"></path></svg></span>
        <span style="flex: 1; min-width: 0">
          <span style="display: block; font-size: 15px; font-weight: 600">家里的主机</span>
          <span style="display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: #4A4A4D; margin-top: 2px"><span style="width: 6px; height: 6px; border-radius: 3px; background: #1A7F37"></span>在线 · 上次走中继</span>
        </span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
      </a>
      <div style="height: 1px; background: #E4E4E2; margin-left: 68px"></div>
      <a href="#" style="display: flex; align-items: center; gap: 12px; height: 64px; padding: 0 16px; color: inherit; text-decoration: none">
        <span style="width: 40px; height: 40px; border-radius: 11px; background: #F2F2F0; color: #8E8E93; display: flex; align-items: center; justify-content: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="13" rx="2"></rect><path d="M8 21h8M12 17v4"></path></svg></span>
        <span style="flex: 1; min-width: 0">
          <span style="display: block; font-size: 15px; font-weight: 600">实验室工作站</span>
          <span style="display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: #4A4A4D; margin-top: 2px"><span style="width: 6px; height: 6px; border-radius: 3px; background: #8E8E93"></span>未在共享 · 上次 11 月 2 日</span>
        </span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
      </a>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button type="button" style="height: 52px; border-radius: 16px; border: 1.5px dashed #C8C8C6; background: transparent; font: inherit; font-size: 14px; font-weight: 500; color: #1D1D1F; display: flex; align-items: center; justify-content: center; gap: 8px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 12h10"></path></svg>
        扫码添加
      </button>
      <button type="button" style="height: 52px; border-radius: 16px; border: 1.5px dashed #C8C8C6; background: transparent; font: inherit; font-size: 14px; font-weight: 500; color: #1D1D1F; display: flex; align-items: center; justify-content: center; gap: 8px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="2" width="8" height="4" rx="1"></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path></svg>
        粘贴邀请
      </button>
    </div>
    <div style="font-size: 12px; color: #6E6E73; padding: 0 4px">手机可以查看并控制 Windows 电脑，暂不能被远程控制。</div>
  </div>

  <div style="position: absolute; left: 0; bottom: 0; width: 390px; height: 84px">
    <dc-import name="MobileTabBar" hint-size="390px,84px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
