<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>桌面查看器 · 控制中</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; background: #0F0F10; font-family: Inter, 'Noto Sans SC', 'Segoe UI', system-ui, sans-serif; color: #EDEDEF; overflow: hidden">
  <header style="height: 36px; display: flex; align-items: center; gap: 10px; padding-left: 16px">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7DB6F2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="13" rx="2"></rect><path d="M8 21h8M12 17v4"></path></svg>
    <span style="font-size: 13px; font-weight: 600">办公室电脑</span>
    <span style="font-size: 12.5px; color: #8E8E93">pb-mapper</span>
    <span style="flex: 1"></span>
    <div style="display: flex; color: #B4B4B8">
      <button type="button" aria-label="最小化" style="width: 44px; height: 36px; border: none; background: transparent; color: inherit; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M1 6h10" stroke="currentColor" stroke-width="1"></path></svg></button>
      <button type="button" aria-label="最大化" style="width: 44px; height: 36px; border: none; background: transparent; color: inherit; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><rect x="1.5" y="1.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1"></rect></svg></button>
      <button type="button" aria-label="关闭" style="width: 44px; height: 36px; border: none; background: transparent; color: inherit; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M1.5 1.5l9 9M10.5 1.5l-9 9" stroke="currentColor" stroke-width="1"></path></svg></button>
    </div>
  </header>

  <div style="position: absolute; left: 0; top: 63px; width: 1440px; height: 810px">
    <dc-import name="RemoteScreen" hint-size="1440px,810px"></dc-import>
  </div>

  <div role="toolbar" aria-label="远程桌面工具栏" style="position: absolute; top: 48px; left: 50%; transform: translateX(-50%); height: 48px; display: flex; align-items: center; gap: 2px; padding: 0 6px; border-radius: 16px; background: rgba(32,32,35,0.9); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 8px 30px rgba(0,0,0,0.4); white-space: nowrap">
    <button type="button" aria-label="固定工具栏" aria-pressed="true" style="width: 36px; height: 36px; border-radius: 10px; border: none; background: rgba(255,255,255,0.1); color: #EDEDEF; display: flex; align-items: center; justify-content: center">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17v5"></path><path d="M9 3h6l-1 6 3 3v2H7v-2l3-3z"></path></svg>
    </button>
    <span style="width: 1px; height: 22px; background: rgba(255,255,255,0.12); margin: 0 4px"></span>
    <button type="button" style="height: 36px; padding: 0 10px; border-radius: 10px; border: none; background: transparent; color: #EDEDEF; font: inherit; font-size: 13px; display: flex; align-items: center; gap: 8px">
      <span style="width: 8px; height: 8px; border-radius: 4px; background: #57C27A"></span>
      直连
      <span style="color: #B4B4B8; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px">16 ms · 60 fps</span>
    </button>
    <span style="width: 1px; height: 22px; background: rgba(255,255,255,0.12); margin: 0 4px"></span>
    <div role="radiogroup" aria-label="操作方式" style="display: flex; gap: 2px; padding: 3px; border-radius: 11px; background: rgba(255,255,255,0.06)">
      <button type="button" role="radio" aria-checked="false" style="height: 30px; padding: 0 10px; border-radius: 8px; border: none; background: transparent; color: #B4B4B8; font: inherit; font-size: 13px; display: flex; align-items: center; gap: 6px">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        查看
      </button>
      <button type="button" role="radio" aria-checked="true" style="height: 30px; padding: 0 10px; border-radius: 8px; border: none; background: rgba(255,255,255,0.16); color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4l7 17 2.5-7.5L21 11z"></path></svg>
        控制
      </button>
    </div>
    <span style="width: 1px; height: 22px; background: rgba(255,255,255,0.12); margin: 0 4px"></span>
    <button type="button" style="height: 36px; padding: 0 10px; border-radius: 10px; border: none; background: transparent; color: #EDEDEF; font: inherit; font-size: 13px; display: flex; align-items: center; gap: 6px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M7 9v6M17 9v6"></path></svg>
      显示
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
    </button>
    <button type="button" aria-expanded="true" style="height: 36px; padding: 0 10px; border-radius: 10px; border: none; background: rgba(255,255,255,0.1); color: #FFFFFF; font: inherit; font-size: 13px; display: flex; align-items: center; gap: 6px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"></rect><path d="M6 9h.01M10 9h.01M14 9h.01M18 9h.01M6 13h.01M18 13h.01M8 16h8"></path></svg>
      快捷键
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
    </button>
    <button type="button" aria-label="更多" style="width: 36px; height: 36px; border-radius: 10px; border: none; background: transparent; color: #EDEDEF; display: flex; align-items: center; justify-content: center">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="19" cy="12" r="1.6"></circle></svg>
    </button>
    <span style="width: 1px; height: 22px; background: rgba(255,255,255,0.12); margin: 0 4px"></span>
    <button type="button" aria-label="全屏" style="width: 36px; height: 36px; border-radius: 10px; border: none; background: transparent; color: #EDEDEF; display: flex; align-items: center; justify-content: center">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"></path></svg>
    </button>
    <button type="button" style="height: 36px; padding: 0 12px; border-radius: 10px; border: none; background: transparent; color: #F2B8B5; font: inherit; font-size: 13px; display: flex; align-items: center; gap: 6px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M12 2v10"></path><path d="M18.4 6.6a9 9 0 1 1-12.8 0"></path></svg>
      断开
    </button>
  </div>

  <div role="menu" aria-label="快捷键" style="position: absolute; top: 104px; left: 792px; width: 300px; box-sizing: border-box; padding: 6px; border-radius: 14px; background: #262628; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 12px 40px rgba(0,0,0,0.5); font-size: 13.5px">
    <button type="button" role="menuitem" style="width: 100%; height: 36px; display: flex; align-items: center; padding: 0 12px; border-radius: 9px; border: none; background: rgba(255,255,255,0.08); color: #EDEDEF; font: inherit"><span style="flex: 1; text-align: left">显示桌面</span><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: #B4B4B8">Win + D</span></button>
    <button type="button" role="menuitem" style="width: 100%; height: 36px; display: flex; align-items: center; padding: 0 12px; border-radius: 9px; border: none; background: transparent; color: #EDEDEF; font: inherit"><span style="flex: 1; text-align: left">切换窗口</span><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: #B4B4B8">Alt + Tab</span></button>
    <button type="button" role="menuitem" style="width: 100%; height: 36px; display: flex; align-items: center; padding: 0 12px; border-radius: 9px; border: none; background: transparent; color: #EDEDEF; font: inherit"><span style="flex: 1; text-align: left">任务管理器</span><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: #B4B4B8">Ctrl + Shift + Esc</span></button>
    <button type="button" role="menuitem" style="width: 100%; height: 36px; display: flex; align-items: center; padding: 0 12px; border-radius: 9px; border: none; background: transparent; color: #EDEDEF; font: inherit"><span style="flex: 1; text-align: left">开始菜单</span><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: #B4B4B8">Win</span></button>
    <button type="button" role="menuitem" style="width: 100%; height: 36px; display: flex; align-items: center; padding: 0 12px; border-radius: 9px; border: none; background: transparent; color: #EDEDEF; font: inherit"><span style="flex: 1; text-align: left">锁定远程电脑</span><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: #B4B4B8">Win + L</span></button>
    <div style="height: 1px; background: rgba(255,255,255,0.08); margin: 6px 8px"></div>
    <button type="button" role="menuitem" disabled style="width: 100%; height: 36px; display: flex; align-items: center; padding: 0 12px; border-radius: 9px; border: none; background: transparent; color: #8E8E93; font: inherit"><span style="flex: 1; text-align: left">Ctrl + Alt + Del</span><span style="font-size: 12px">暂不支持</span></button>
    <div style="height: 1px; background: rgba(255,255,255,0.08); margin: 6px 8px"></div>
    <button type="button" role="menuitem" style="width: 100%; height: 36px; display: flex; align-items: center; padding: 0 12px; border-radius: 9px; border: none; background: transparent; color: #EDEDEF; font: inherit"><span style="flex: 1; text-align: left">刷新画面</span></button>
    <button type="button" role="menuitem" style="width: 100%; height: 36px; display: flex; align-items: center; padding: 0 12px; border-radius: 9px; border: none; background: transparent; color: #EDEDEF; font: inherit"><span style="flex: 1; text-align: left">释放所有按键</span></button>
  </div>

  <div role="status" style="position: absolute; bottom: 64px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 16px; border-radius: 20px; background: rgba(32,32,35,0.9); border: 1px solid rgba(255,255,255,0.08); font-size: 13px; color: #EDEDEF; white-space: nowrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7DB6F2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"></rect><path d="M8 15h8"></path></svg>
    键盘和鼠标正发往办公室电脑
    <span style="color: #B4B4B8">系统快捷键请从工具栏发送</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
