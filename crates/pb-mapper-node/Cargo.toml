[package]
name = "pb-mapper-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Node-API bindings for the pb-mapper client SDK"
publish = false

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
napi.workspace = true
napi-derive.workspace = true
pb-mapper-client = { workspace = true, features = ["p2p", "relay-quic", "port-mapping"] }
serde_json.workspace = true
# Already linked through the SDK; named here for the readers' `Mutex`,
# `timeout` and `select!`, and the status `watch`.
tokio.workspace = true
tokio-util.workspace = true

[build-dependencies]
napi-build.workspace = true
