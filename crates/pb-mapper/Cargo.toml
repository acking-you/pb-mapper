[package]
name = "pb-mapper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Client SDK for pb-mapper: reach private TCP/UDP services peer to peer over QUIC, with automatic relay fallback and reconnection"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/pb-mapper"
readme = "README.md"
keywords = ["p2p", "tunnel", "nat-traversal", "quic", "relay"]
categories = ["network-programming"]
publish = ["crates-io"]

[dependencies]
pb-mapper-client.workspace = true

[features]
port-mapping = ["p2p", "pb-mapper-client/port-mapping"]
relay-quic = ["pb-mapper-client/relay-quic"]
# Direct QUIC with relay fallback is the default path; the relay carrier is TCP.
# Disabling both `p2p` and `relay-quic` drops quinn, rcgen and stun-proto.
default = ["p2p", "relay-quic"]
p2p = ["pb-mapper-client/p2p"]

[dev-dependencies]
tokio.workspace = true
serde_json.workspace = true
# `examples/quickstart.rs` runs its own relay in-process so it needs no setup.
pb-mapper-auth.workspace = true
pb-mapper-server = { workspace = true, features = ["p2p"] }
tokio-util.workspace = true

[lints]
workspace = true
