[package]
name = "pb-mapper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Client SDK for pb-mapper: reach private TCP/UDP services peer to peer over QUIC, with automatic relay fallback and reconnection, and an optional remote desktop"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/pb-mapper"
readme = "README.md"
keywords = ["p2p", "tunnel", "nat-traversal", "quic", "relay"]
categories = ["network-programming"]
publish = ["crates-io"]

# The desktop host is Windows-only, so docs.rs builds both to show it.
[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
pb-mapper-client.workspace = true
pb-mapper-desktop = { workspace = true, optional = true }

[features]
desktop = ["dep:pb-mapper-desktop"]
port-mapping = ["p2p", "pb-mapper-client/port-mapping"]
relay-quic = ["pb-mapper-client/relay-quic"]
# Direct QUIC with relay fallback is the default path; the relay carrier is TCP.
# Disabling both `p2p` and `relay-quic` drops quinn, rcgen and stun-proto.
# `port-mapping` lets a tunnel ask the router for a mapping once punching
# fails (`PortMapping::Auto`, the default); without it, none is ever asked.
default = ["p2p", "relay-quic", "port-mapping"]
p2p = ["pb-mapper-client/p2p"]

[dev-dependencies]
tokio.workspace = true
serde_json.workspace = true
# `examples/quickstart.rs` and `desktop_loopback.rs` run their own relay
# in-process so they need no setup.
pb-mapper-auth.workspace = true
pb-mapper-server = { workspace = true, features = ["p2p"] }
tokio-util.workspace = true

# Needs the router-facing code, which `--no-default-features` leaves out.
[[example]]
name = "port_mapping"
required-features = ["port-mapping"]

[[example]]
name = "desktop_loopback"
required-features = ["desktop"]

[[example]]
name = "desktop_host"
required-features = ["desktop"]

[[example]]
name = "desktop_viewer"
required-features = ["desktop"]

[[example]]
name = "desktop_control"
required-features = ["desktop"]

[[example]]
name = "desktop_supervised"
required-features = ["desktop"]

[lints]
workspace = true
