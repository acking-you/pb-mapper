[package]
name = "pb-mapper-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Credentials, checksums, addressing, and shared primitives for pb-mapper"
publish = ["crates-io"]

[[test]]
name = "process_environment"
harness = false

[dependencies]
base64.workspace = true
hickory-resolver.workspace = true
parking_lot.workspace = true
rand.workspace = true
ring.workspace = true
serde_json.workspace = true
snafu.workspace = true
tokio.workspace = true
tracing.workspace = true

[features]
system-awake = ["dep:objc2", "dep:objc2-foundation", "dep:windows", "dep:zbus"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true, optional = true }
objc2-foundation = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, optional = true, features = ["Win32_System_Power"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { workspace = true, optional = true }

[lints]
workspace = true
