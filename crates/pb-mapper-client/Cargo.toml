[package]
name = "pb-mapper-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Register, connect, status, and admin client implementation for pb-mapper"
publish = ["crates-io"]

[dependencies]
quinn = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }
stun-proto = { workspace = true, optional = true }
ring = { workspace = true, optional = true }
rand.workspace = true
pb-mapper-auth.workspace = true
pb-mapper-core.workspace = true
pb-mapper-protocol.workspace = true

serde_json.workspace = true
snafu.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true
uni-stream.workspace = true
serde = { workspace = true, features = ["derive"] }
if-addrs = { version = "0.15", features = ["link-local"] }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
if-watch = { version = "3.2.2", default-features = false, features = ["tokio"] }

[dev-dependencies]
pb-mapper-server = { workspace = true, features = ["p2p"] }
tokio = { workspace = true, features = ["test-util"] }

[features]
relay-quic = ["dep:quinn", "pb-mapper-protocol/relay-quic"]
p2p = ["dep:quinn", "dep:rcgen", "dep:stun-proto", "dep:ring"]
udp-timeout = ["uni-stream/udp-timeout", "pb-mapper-protocol/udp-timeout"]

[lints]
workspace = true
