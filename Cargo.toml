[workspace]
# Every library and the CLI live under `crates/`. The FFI cdylib stays next to
# the Flutter code that loads it.
members = ["crates/*", "ui/native/pb_mapper_ffi", "ui/native/pb_mapper_galaxy"]
exclude = ["deps/uni-stream", "deps/kanal", "deps/quinn", "deps/rcgen", "deps/stun-proto", "deps/portmapper"]
# Spelled out: a virtual manifest does not infer the resolver from the edition,
# and without this it silently falls back to resolver 1.
resolver = "3"

[workspace.package]
# `version` must stay the first key here: `release.yml` and `docker-publish.yml`
# both parse it positionally with awk to check the tag against it.
version = "0.11.0"
authors = ["L_B__"]
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
repository = "https://github.com/acking-you/pb-mapper"
homepage = "https://github.com/acking-you/pb-mapper"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[workspace.dependencies]
pb-mapper-auth = { path = "crates/pb-mapper-auth", version = "0.11.0" }
# Defaults off: the FFI turns port mapping on per target (not on iOS).
pb-mapper = { path = "crates/pb-mapper", version = "0.11.0", default-features = false }
pb-mapper-client = { path = "crates/pb-mapper-client", version = "0.11.0" }
pb-mapper-desktop = { path = "crates/pb-mapper-desktop", version = "0.11.0" }
pb-mapper-core = { path = "crates/pb-mapper-core", version = "0.11.0" }
pb-mapper-protocol = { path = "crates/pb-mapper-protocol", version = "0.11.0" }
pb-mapper-server = { path = "crates/pb-mapper-server", version = "0.11.0" }
pb-mapper-galaxy = { path = "ui/native/pb_mapper_galaxy" }
# Test support only; never a dependency of a shipped crate.
pb-mapper-testkit = { path = "crates/pb-mapper-testkit" }

base64 = "0.23.1"
enigo = { version = "0.6.1", default-features = false }
image = { version = "0.25.9", default-features = false, features = ["jpeg"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
# The direct path's TCP listener on a LAN: an IPv6 socket of its own beside the
# IPv4 one, and keep-alive. Already locked through tokio.
socket2 = "0.6.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_StationsAndDesktops", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_Graphics_Gdi"] }
windows-service = "0.8.1"
xcap = { version = "0.9.8", default-features = false }
windows-capture = "2.0.1"
better_mimalloc_rs = { version = "0.1.2", features = ["config"] }
bytes = "1.11"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0.0"
hashbrown = { version = "0.17.1" }
hickory-resolver = { version = "0.26.1" }
if-addrs = { version = "0.15", features = ["link-local"] }
if-watch = { version = "3.2.2", default-features = false, features = ["tokio"] }
# The Android video feeder's exports in pb-mapper-ffi. Already locked through
# netdev, so an offline `--locked` build needs nothing new.
jni = "0.21.1"
# The published fork is source-equivalent to the former Git dependency. Keep
# the local crate name so server code does not need to know the package name.
kanal = { package = "kanal-plus", version = "0.2.0" }
napi = { version = "3.12.2", default-features = false, features = ["napi8", "async"] }
napi-build = "2.4.1"
napi-derive = "3.6.3"
# Interface types and gateways, to put LAN candidates first. The same version
# portmapper's netwatch already brings in.
netdev = "0.46.3"
# The macOS desktop host (pb-mapper-desktop's platform/macos): ScreenCaptureKit,
# VideoToolbox, Core Graphics, ImageIO, the Keychain. Only the headers used;
# already locked through xcap.
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSError", "NSGeometry", "NSObject", "NSProcessInfo", "NSString"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFCGTypes", "CFData", "CFDictionary", "CFNotificationCenter", "CFNumber", "CFString", "CFUUID"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "objc2", "libc", "CGBitmapContext", "CGColorSpace", "CGContext", "CGDirectDisplay", "CGDisplayConfiguration", "CGDisplayStream", "CGError", "CGEvent", "CGEventSource", "CGEventTypes", "CGImage", "CGRemoteOperation", "CGSession", "CGWindow"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "objc2", "objc2-core-video", "CMBase", "CMBlockBuffer", "CMFormatDescription", "CMSampleBuffer", "CMTime"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "objc2", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
objc2-screen-capture-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "dispatch2", "objc2-core-foundation", "objc2-core-graphics", "objc2-core-media", "SCScreenshotManager", "SCShareableContent", "SCStream"] }
objc2-video-toolbox = { version = "0.3.2", default-features = false, features = ["std", "objc2", "objc2-core-media", "objc2-core-video", "VTBase", "VTCompressionProperties", "VTCompressionSession", "VTErrors", "VTSession"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-graphics", "NSCursor", "NSEvent", "NSGraphicsContext", "NSImage", "NSImageRep"] }
objc2-image-io = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-graphics", "CGImageDestination"] }
objc2-security = { version = "0.3.2", default-features = false, features = ["std", "SecBase", "SecItem"] }
block2 = "0.6.2"
libc = "0.2.190"
dispatch2 = { version = "0.3.1", default-features = false, features = ["std", "objc2"] }
parking_lot = "0.12"
portmapper = { package = "portmapper-plus", path = "deps/portmapper/portmapper", version = "0.20.0", default-features = false }
rand = "0.10"
ring = "0.17.14"
rolling-file = "0.2.0"
# Pinned forks, published by `release-sdk.yml` as quinn-plus (with
# quinn-proto-plus and quinn-udp-plus) and rcgen-plus, under the crate names
# the code imports. Bump a fork's version whenever its pinned source changes:
# the release refuses to reuse a published version for different source.
quinn = { package = "quinn-plus", path = "deps/quinn/quinn", version = "0.12.0", default-features = false, features = ["runtime-tokio", "rustls-ring", "fast-apple-datapath"] }
rcgen = { package = "rcgen-plus", path = "deps/rcgen/rcgen", version = "0.15.0", default-features = false, features = ["ring"] }
stun-proto = { path = "deps/stun-proto/stun-proto", version = "2.0.4" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
snafu = "0.9.2"
subtle = "2.6.1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1.40"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.18", features = [
    "env-filter",
    "fmt",
    "json",
], default-features = true }
uni-stream = "0.3.5"

# Used by `js/` (`napi build --profile release-node --strip`) to keep the
# Node-API cdylib small. The default `release` profile is left alone so the
# CLI/server compile time does not grow.
[profile.release-node]
inherits = "release"
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "s"
