[package]
name = "pb-mapper"
version.workspace = true
edition.workspace = true
authors.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
pb-mapper-core.workspace = true
rand.workspace = true
tokio.workspace = true
tokio-util.workspace = true
snafu.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
hashbrown.workspace = true
clap.workspace = true
better_mimalloc_rs.workspace = true
bytes.workspace = true
ring.workspace = true
uni-stream.workspace = true
kanal.workspace = true
base64.workspace = true
subtle.workspace = true
parking_lot.workspace = true

[dev-dependencies]
dotenvy.workspace = true

[features]
udp-timeout = ["uni-stream/udp-timeout"]

[workspace]
members = ["crates/*", "ui/native/pb_mapper_ffi"]
exclude = ["deps/uni-stream", "deps/kanal"]
# Spelled out because a virtual manifest does not infer the resolver from the
# edition, and this root becomes virtual once `src/` is empty.
resolver = "3"

[workspace.package]
# `version` must stay the first key here: `release.yml` and `docker-publish.yml`
# both parse it positionally with awk to check the tag against it.
version = "0.4.0"
authors = ["L_B__"]
edition = "2024"

[workspace.lints.clippy]
# The FFI crate has denied these since it was written — a panic crossing the C
# ABI is undefined behaviour rather than a stack trace. Everything here is
# reachable from that boundary, so the whole workspace inherits it.
unwrap_used = "deny"
expect_used = "deny"

[workspace.dependencies]
pb-mapper-core = { path = "crates/pb-mapper-core" }

rand = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
snafu = "0.9.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = [
    "env-filter",
    "fmt",
    "json",
], default-features = true }
hashbrown = { version = "0.17.1" }
clap = { version = "4.5", features = ["derive"] }
better_mimalloc_rs = { version = "0.1.2", features = ["config"] }
bytes = "1.11"
hickory-resolver = { version = "0.26.1" }
ring = "0.17.14"
base64 = "0.23.1"
subtle = "2.6.1"
parking_lot = "0.12"
dirs = "6.0.0"
dotenvy = "0.15.7"
uni-stream = { git = "https://github.com/acking-you/uni-stream.git", branch = "master" }
kanal = { git = "https://github.com/acking-you/kanal.git", branch = "dev/pb-mapper" }
