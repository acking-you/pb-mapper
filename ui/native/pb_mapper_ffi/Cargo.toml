[package]
name = "pb-mapper-ffi"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "staticlib"]

[lints]
workspace = true

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0"
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
clap.workspace = true
better_mimalloc_rs.workspace = true
tokio-util.workspace = true
dirs.workspace = true

pb-mapper-auth.workspace = true
# Direct sessions, as the CLI has them: a connection tries a direct path
# first and falls back to the relay, and the embedded relay offers one.
pb-mapper-client = { workspace = true, features = ["p2p"] }
pb-mapper-core.workspace = true
pb-mapper-galaxy.workspace = true
pb-mapper-protocol.workspace = true
pb-mapper-server = { workspace = true, features = ["p2p"] }
uni-stream.workspace = true
parking_lot.workspace = true
# The update manifest's Ed25519 signature; see src/update.rs.
ring.workspace = true

[dev-dependencies]
# A live relay for the Relay page's calls; see src/relay.rs.
pb-mapper-testkit.workspace = true
