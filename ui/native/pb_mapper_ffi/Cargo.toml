[package]
name = "pb-mapper-ffi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "staticlib"]

[lints]
workspace = true

[features]
# `pb_mapper_desktop_video_test_source_v1`: plays a `video_bench --dump` clip
# into a video source, so native consumers run on a device without a session.
# A debugging aid; no release script enables it.
desktop-test-source = ["dep:bytes"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
rolling-file.workspace = true
tokio.workspace = true
clap.workspace = true
better_mimalloc_rs.workspace = true
tokio-util.workspace = true
dirs.workspace = true

pb-mapper-auth.workspace = true
pb-mapper = { workspace = true, features = ["desktop", "p2p", "relay-quic"] }
# Direct sessions, as the CLI has them: a connection tries a direct path
# first and falls back to the relay, and the embedded relay offers one. The
# relay itself is reached over TCP or, when Settings says so, QUIC. Port
# mapping comes per target, below.
pb-mapper-client = { workspace = true, features = ["p2p", "relay-quic"] }
pb-mapper-core.workspace = true
pb-mapper-galaxy.workspace = true
pb-mapper-server = { workspace = true, features = ["p2p", "relay-quic"] }
uni-stream.workspace = true
parking_lot.workspace = true
# The update manifest's Ed25519 signature; see src/update.rs. Also the
# remembered computers' AES-GCM on Android; see src/desktop_computers.rs.
ring.workspace = true
# The remembered computers' vault key, as Dart passes it.
base64.workspace = true
bytes = { workspace = true, optional = true }

# Port mapping (PCP, NAT-PMP, UPnP) asks netwatch and netdev for the gateway,
# and netdev does not build for iOS: an iOS app maps no port, as a build
# without the feature does (`PortMapping::Auto` never asks, `Always` is
# refused).
[target.'cfg(not(target_os = "ios"))'.dependencies]
pb-mapper = { workspace = true, features = ["port-mapping"] }
pb-mapper-client = { workspace = true, features = ["port-mapping"] }

[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true

# The preferences a sandboxed 0.11.0 kept in its container, copied out once.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { workspace = true, features = ["CFError", "CFPreferences", "CFPropertyList"] }

# Dart opens this library with dlopen after startup. mimalloc's default
# initial-exec TLS must then fit the little static TLS glibc keeps for late
# libraries, and with this library's thread locals it does not: the load
# fails with "cannot allocate memory in static TLS block".
[target.'cfg(target_os = "linux")'.dependencies]
better_mimalloc_rs = { workspace = true, features = ["local_dynamic_tls"] }

[dev-dependencies]
# A live relay for the Relay page's calls; see src/relay.rs.
pb-mapper-testkit.workspace = true
bytes.workspace = true
# Paused time for the tests; on iOS no dependency turns it on for them.
tokio = { workspace = true, features = ["test-util"] }
